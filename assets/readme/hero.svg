<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Agent Workbench Template</title>
  <desc id="desc">A host-agnostic side-panel workbench with four modes, two rows of filters, a full-width list, Markdown reading and an editable annotation layer.</desc>

  <rect width="1200" height="380" rx="26" fill="#F8FAFC"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2.2" fill="#C96442">AGENT WORKBENCH / HOST-AGNOSTIC</text>
    <text x="64" y="138" font-size="52" font-weight="700" fill="#0F172A">把侧栏做成</text>
    <text x="64" y="194" font-size="52" font-weight="700" fill="#0F172A">真正顺手的工作台</text>
    <text x="64" y="240" font-size="21" fill="#475569">4 个模式 · 两行筛选 · Markdown 阅读</text>
    <text x="64" y="272" font-size="21" fill="#475569">批注可写；壳不变，内容随你换。</text>
    <text x="64" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#64748B">Node 18+  ·  no build  ·  OpenChamber / Web / DSH / OpenCode</text>
  </g>

  <g id="shell-preview" transform="translate(656 48)">
    <rect width="480" height="284" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>

    <path d="M 0 46 H 480" stroke="#E2E8F0"/>
    <rect x="20" y="18" width="10" height="10" rx="2" fill="#C96442"/>
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#0F172A">Agent 工作台</text>
    <text x="404" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#94A3B8">预览</text>

    <g id="tabs" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18">
      <text x="20" y="76" font-weight="600" fill="#C96442">今日</text>
      <rect x="20" y="84" width="38" height="2" rx="1" fill="#C96442"/>
      <text x="104" y="76" fill="#64748B">资料库</text>
      <text x="190" y="76" fill="#64748B">报告</text>
      <text x="264" y="76" fill="#64748B">设置</text>
    </g>

    <g id="filters" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <rect x="20" y="100" width="76" height="26" rx="6" fill="#FDF0EA" stroke="#E7C9BC"/>
      <text x="34" y="118" fill="#A94F32">示例市</text>
      <rect x="104" y="100" width="58" height="26" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="118" y="118" fill="#475569">申报</text>
      <text x="180" y="118" fill="#94A3B8">全部状态</text>
      <text x="404" y="118" fill="#94A3B8">共 4 条</text>
    </g>

    <g id="list" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <text x="20" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#94A3B8">11-12</text>
      <text x="82" y="160" font-size="18" font-weight="600" fill="#0F172A">示例市智能终端产业发展行动方案</text>
      <circle cx="450" cy="155" r="4" fill="#D97706"/>
      <path d="M 20 174 H 460" stroke="#F1F5F9"/>

      <text x="20" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#94A3B8">11-10</text>
      <text x="82" y="200" font-size="18" font-weight="600" fill="#0F172A">智能制造试点项目申报</text>
      <circle cx="450" cy="195" r="4" fill="#2563EB"/>
      <path d="M 20 214 H 460" stroke="#F1F5F9"/>

      <text x="20" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#94A3B8">11-08</text>
      <text x="82" y="240" font-size="18" font-weight="600" fill="#0F172A">人工智能重点实验室建设指南</text>
      <circle cx="450" cy="235" r="4" fill="#D97706"/>
      <path d="M 20 254 H 460" stroke="#F1F5F9"/>
    </g>
  </g>

  <text x="656" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#94A3B8">shell, not a domain · 10 fictional items</text>
</svg>

