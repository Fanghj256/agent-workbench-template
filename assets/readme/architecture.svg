<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">Workbench architecture</title>
  <desc id="desc">UI shell in core/, thin window.workbenchHost interface, host adapters, and local workbench data files.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B4552F"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="18" fill="#F6F3EC"/>
  <rect x="0.5" y="0.5" width="1199" height="389" rx="18" fill="none" stroke="#E2DBD1"/>

  <g id="header" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="52" font-size="26" font-weight="700" fill="#24201C">界面、宿主与数据各走各的目录</text>
    <text x="56" y="82" font-size="18" fill="#6D665D">换宿主不动界面，换行业内容也不改代码</text>
  </g>

  <g id="core" transform="translate(56 112)">
    <rect width="314" height="176" rx="8" fill="#FFFDFA" stroke="#E2DBD1" stroke-width="1.2"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#24201C">core/</text>
    <text x="108" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#B4552F">界面壳子</text>
    <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#24201C">列表、筛选与 Markdown</text>
    <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#4E4842">批注编辑与动作条</text>
    <text x="22" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#6D665D">不绑定任何具体宿主</text>
  </g>

  <g id="host" transform="translate(426 122)">
    <rect width="340" height="156" rx="8" fill="#F8ECE4" stroke="#B4552F" stroke-width="1.5"/>
    <text x="22" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#8D3F20">window.workbenchHost</text>
    <text x="22" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#24201C">loadIndex / loadAnnotations</text>
    <text x="22" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#24201C">saveAnnotations / loadItem</text>
    <text x="22" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8D3F20">sendToAgent / openExternal</text>
  </g>

  <g id="adapters" transform="translate(822 112)">
    <rect width="322" height="176" rx="8" fill="#FFFDFA" stroke="#E2DBD1" stroke-width="1.2"/>
    <text x="22" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#24201C">adapters/</text>
    <text x="158" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#B4552F">宿主适配</text>
    <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#24201C">OpenChamber 侧栏扩展</text>
    <text x="22" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#4E4842">内置 Web (server.mjs)</text>
    <text x="22" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#6D665D">DSH / OpenCode / 自建壳</text>
  </g>

  <g id="connections" stroke="#B4552F" stroke-width="2" fill="none">
    <line x1="374" y1="200" x2="418" y2="200" marker-end="url(#arrow)"/>
    <line x1="770" y1="200" x2="814" y2="200" marker-end="url(#arrow)"/>
  </g>

  <g id="data" transform="translate(56 314)">
    <rect width="1088" height="48" rx="6" fill="#EDE7DC" stroke="#DCD4C8"/>
    <text x="22" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#8D3F20">workbench/</text>
    <text x="166" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#24201C">config.json · index.json · annotations.json · reports.json · items/</text>
  </g>
</svg>
